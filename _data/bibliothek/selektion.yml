# Beobachtungstechniken fuer die Selektion (Quelle: Excel-Blatt Beobachtungen).
- titel: Stammanalyse
  techniken:
  - name: Stem Rub
    durchfuehrung: Den Stamm im oberen Drittel zwischen Daumen und Zeigefinger kräftig reiben und riechen.
    suche: Stechendes Gas (Diesel) oder künstliche Süße (Bubblegum).
    bedeutung: Bestimmt das primäre Aroma der Nachkommen.
  - name: Hollow Stem Check
    durchfuehrung: Vorsichtiges Fühlen/Drücken des Hauptstamms (ist er hohl oder massiv?).
    suche: Hohle Stämme gelten oft als Indikator für hohe THC-Vererbung (viele Chem/Diesel Linien).
    bedeutung: Potenz-Indikator (klassische Züchter-Theorie).
  - name: Nodal Spacing
    durchfuehrung: Messen des Abstands zwischen den Blattachseln.
    suche: Kurze Abstände = kompakte Buds; Lange Abstände = Stretch & große Erträge.
    bedeutung: Bestimmt die spätere Struktur der Blütenstände.
  - name: Lattich-Test
    durchfuehrung: Zerreiben eines Sonnensegels zwischen den Fingern.
    suche: Riecht es nur nach "grün" oder kommen komplexe Untertöne durch?
    bedeutung: Hinweis auf die Tiefe des Terpen-Profils.
- titel: Die "Vigor & Resilienz" (Wachstums-Dynamik)
  techniken:
  - name: Root Bound Test
    durchfuehrung: Den Ballen kurz aus dem 0,5L Topf heben.
    suche: Aggressives, reinweißes Wurzelgeflecht ohne braune Stellen.
    bedeutung: Vererbt Vitalität und Nährstoffaufnahme-Effizienz.
  - name: Cold Stress
    durchfuehrung: Die Nachtabsenkung auf 12-15°C nutzen.
    suche: Verfärbung der Stiele (Purpling) oder Wachstumsstopp?
    bedeutung: Zeigt das Potenzial für "Farbe" und Kälteresistenz.
  - name: Recovery Speed
    durchfuehrung: Nach dem ersten Topping/Beschneiden die Zeit stoppen.
    suche: Wer bildet am schnellsten neue Triebe?
    bedeutung: Wichtig für die Regenerationsfähigkeit der F1.
  - name: Water Stress
    durchfuehrung: Einmal kurz antrocknen lassen (leichtes Welken).
    suche: Wer steht nach dem Gießen am schnellsten wieder stramm?
    bedeutung: Indikator für die allgemeine Robustheit (Stress-Toleranz).
  - name: Wuchs- & Geschlechts-Timing (Der "Faserhanf-Test")
    durchfuehrung: Beobachtung des Höhenwachstums in den ersten 3-4 Wochen.
    suche: Gleichmäßige, proportionale Entwicklung. Extrem hochgewachsene Ausreißer mit unverhältnismäßig früher Vorblüte werden aussortiert.
    bedeutung: Verhindert die Einkreuzung von "wilden" Faserhanf-Merkmalen. Sichert eine dichte Blütenstruktur und schützt den Ertrag vor "luftigen" Phänotypen.
- titel: Die "Blüten-Morphologie" (Männliche Blüte)
  techniken:
  - name: Trichome-Scanning
    durchfuehrung: Mit dem Mikroskop/Lupe die Außenseite der Pollensäcke prüfen.
    suche: Harzbesatz auf den Säcken! (Sehr selten, aber der Jackpot).
    bedeutung: Vererbt extremen Frost und Harzreichtum an die Töchter.
  - name: Pollen-Volumen
    durchfuehrung: Klopfen gegen einen reifen Sack über schwarzem Papier.
    suche: Massiver, feiner gelber Ausstoß.
    bedeutung: Zeigt die sexuelle Vitalität des Vaters an.
  - name: Cluster-Dichte
    durchfuehrung: Wie viele Säcke sitzen an einem Knotenpunkt?
    suche: Dicht gedrängte Trauben vs. vereinzelte Säcke.
    bedeutung: Beeinflusst die Dichte der späteren weiblichen Buds (Bud-Structure).
  - name: Antheren-Farbe
    durchfuehrung: Farbe der Staubbeutel im Inneren des Sacks prüfen.
    suche: Von blassgelb bis rötlich/violett möglich.
    bedeutung: Kann Hinweise auf die Anthocyan-Produktion (Farbe) geben.

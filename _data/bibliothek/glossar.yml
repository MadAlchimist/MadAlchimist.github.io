# Glossar (Quelle: Excel-Blatt Glossar). Spalten: begriff, kuerzel, text.
- begriff: Inbred Line
  kuerzel: IBL
  text: Eine über viele Generationen (F5+) mit sich selbst gekreuzte Linie. Sie ist genetisch extrem stabil (homozygot). Die Bubble Gum von Serious ist eine solche IBL – sie vererbt ihre Merkmale fast wie ein "Stempel".
- begriff: Filialgeneration
  kuerzel: F1, F2...
  text: 'F1: Die erste Kreuzung zweier nicht verwandter Eltern (z.B. Sour Diesel x Bubble Gum). Meist sehr wüchsig (Hybrid Vigor). F2: Kreuzung von zwei F1-Geschwistern. Hier findet die maximale Aufspaltung der Merkmale statt (Selektionsphase).'
- begriff: Backcross
  kuerzel: BX
  text: 'Rückkreuzung eines Nachkommens mit einem der Elternteile (z.B. F1 x Vater). Ziel: Die Merkmale dieses einen Elternteils (z.B. das Gas der Sour Diesel) in der Linie zu dominieren.'
- begriff: Homozygot
  kuerzel: null
  text: Reinerbigkeit. Die Pflanze hat für ein Merkmal zwei identische Erbanlagen. IBLs sind hochgradig homozygot, was sie zu perfekten Zuchtvätern macht.
- begriff: Heterozygot
  kuerzel: null
  text: Mischerbigkeit. Die Pflanze trägt unterschiedliche Erbanlagen für ein Merkmal (typisch für moderne Hybride). Hier ist das Ergebnis der Nachkommen schwerer vorherzusagen.
- begriff: Phänotyp
  kuerzel: Phäno
  text: Das äußere Erscheinungsbild (Wuchsform, Geruch, Farbe). Das, was man im Zelt sieht und riecht.
- begriff: Genotyp
  kuerzel: null
  text: Das unsichtbare Erbgut. Die Gesamtheit aller Gene, auch derer, die man im aktuellen Phänotyp vielleicht gar nicht sieht (rezessive Gene).
- begriff: Dominant
  kuerzel: null
  text: Ein Merkmal, das sich im Phänotyp durchsetzt (z.B. oft die Wuchshöhe der Sour Diesel).
- begriff: Rezessiv
  kuerzel: null
  text: Ein Merkmal, das "überschrieben" wird und nur sichtbar wird, wenn beide Eltern es weitergeben (z.B. oft bestimmte Farben oder spezielle Terpene wie bei der Blueberry).
- begriff: Hybrid Vigor
  kuerzel: Heterosis
  text: Der Effekt, dass die F1-Generation oft kräftiger, schneller und ertragreicher wächst als beide Elternteile für sich.
- begriff: Stamm-Rub
  kuerzel: Stem Rub
  text: Technik zur Bestimmung des Terpen-Potenzials in der Veggie. Durch Reiben am Stamm werden Trichome zerstört und der Geruch freigesetzt. Wichtig für die Männchen-Selektion!
- begriff: Internodien
  kuerzel: Nodienabstände
  text: Der Abstand zwischen den Astansätzen. Kurze Abstände deuten oft auf Indica-Dominanz hin, lange auf Sativa-Einfluss (wie bei der Black Widow).
